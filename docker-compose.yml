version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: bonvies_call-schedule_backend
    ports:
      - "4020:4020"
      - "4021:4021"
      - "4022:4022"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/apps/backend/data
    networks:
      - call-schedule-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: bonvies_call-schedule_frontend
    ports:
      - "4030:80"
    depends_on:
      - backend
    networks:
      - call-schedule-network
    restart: unless-stopped

volumes:
  sqlite_data:

networks:
  call-schedule-network:
    driver: bridge