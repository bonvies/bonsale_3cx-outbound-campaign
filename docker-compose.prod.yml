version: '3.8'

services:
  backend:
    image: gcr.io/drvet-server-sysstore-bonvies/bonvies_call-schedule_backend:latest
    container_name: bonvies_call-schedule_backend
    ports:
      - "4020:4020"
      - "4021:4021"
      - "4022:4022"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/apps/backend/data
    networks:
      - call-schedule-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "256m"
        max-file: "10"

  frontend:
    image: gcr.io/drvet-server-sysstore-bonvies/bonvies_call-schedule_frontend:latest
    container_name: bonvies_call-schedule_frontend
    ports:
      - "4030:80"
    depends_on:
      - backend
    networks:
      - call-schedule-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:

networks:
  call-schedule-network:
    driver: bridge
